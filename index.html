<!doctype html>
<html lang="ro">
  <head>
    <!-- Primary meta -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Webvertize - Creare Websiteuri, Aplicații Web și Campanii de Publicitate
    </title>
    <meta
      name="description"
      content="Webvertize oferă pachete Basic, Standard și Premium pentru prezența digitală completă a afacerii tale — site web profesional, administrare conținut, chat în timp real. Dezvoltăm și site-uri la cerere și rulăm campanii Google Ads & Facebook Ads."
    />

    <link
      rel="preload"
      href="./src/assets/headers/homepage_header.webp"
      as="image"
      fetchpriority="high"
    />

    <link
      rel="preload"
      href="./src/assets/headers/prices_header_img.webp"
      as="image"
      fetchpriority="high"
    />

    <link
      rel="preload"
      href="./src/assets/headers/portfolio-header.webp"
      as="image"
      fetchpriority="high"
    />

    <!-- Canonical -->
    <link rel="canonical" href="https://webvertize.ro/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://webvertize.ro/" />
    <meta
      property="og:title"
      content="Webvertize – Creare Website-uri și Aplicații Web"
    />
    <meta
      property="og:description"
      content="Site-uri web profesionale și marketing digital pentru afaceri locale. CMS, chat live și campanii Google Ads."
    />
    <meta property="og:image" content="https://webvertize.ro/og_image.png" />
    <meta property="og:locale" content="ro_RO" />
    <meta property="og:site_name" content="Webvertize SRL" />

    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.ico" />
    <!-- Turnstile -->
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js"
      async
      defer
    ></script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Webvertize SRL",
        "url": "https://webvertize.ro",
        "logo": "https://webvertize.ro/logo.png",
        "image": "https://webvertize.ro/og_image.png",
        "description": "Creare site-uri web profesionale și servicii de marketing digital pentru afaceri locale din România. Specializați în site-uri de prezentare cu CMS, chat integrat și campanii Google Ads.",
        "telephone": "+40775511874",
        "email": "contact@webvertize.ro",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Galați",
          "addressRegion": "GL",
          "addressCountry": "RO"
        },
        "areaServed": [
          {
            "@type": "City",
            "name": "București"
          },
          {
            "@type": "Country",
            "name": "România"
          }
        ],
        "sameAs": ["https://www.facebook.com/webvertize"],
        "serviceType": [
          "Creare site-uri web",
          "Marketing digital",
          "Campanii Google Ads",
          "CMS personalizat"
        ],
        "foundingDate": "2025-12"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <body>
      <div id="root"></div>
      <noscript>
        <p>
          Webvertize SRL – Creare site-uri web și marketing digital pentru
          afaceri locale din România.
        </p>
        <p>Telefon: +40775511874</p>
        <p>Email: contact@webvertize.ro</p>
        <p>Facebook: facebook.com/webvertize</p>
      </noscript>
      <script type="module" src="/src/main.jsx"></script>
    </body>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
